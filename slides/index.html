// ---- Markdown（このテンプレで使う分だけ） ----
function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inline(text) {
  const codes = [];
  let out = escapeHtml(text).replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return '\u0000' + (codes.length - 1) + '\u0000';
  });
  out = out
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => /\.(mp4|webm|mov)$/i.test(src)
      ? '<video src="' + src + '" controls muted playsinline loop aria-label="' + alt + '"></video>'
      : '<img src="' + src + '" alt="' + alt + '">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, href) => href.startsWith('#')
      ? '<a href="' + href + '">' + label + '</a>'
      : '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}

function renderList(lines, ordered) {
  const tag = ordered ? 'ol' : 'ul';
  const start = ordered ? parseInt(lines[0], 10) : 1;
  const open = start > 1 ? '<ol start="' + start + '">' : '<' + tag + '>';
  const items = lines.map((l) => '<li>' + inline(l.replace(/^\s*([-*]|\d+\.)\s+/, '')) + '</li>');
  return open + items.join('') + '</' + tag + '>';
}

function renderBlock(block) {
  const lines = block.split('\n');
  const first = lines[0];
  const heading = first.match(/^(#{1,2})\s+(.*)$/);
  if (heading && lines.length === 1) return '<h' + heading[1].length + '>' + inline(heading[2]) + '</h' + heading[1].length + '>';
  if (lines.every((l) => /^\s*[-*]\s+/.test(l))) return renderList(lines, false);
  if (lines.every((l) => /^\s*\d+\.\s+/.test(l))) return renderList(lines, true);
  if (lines.length > 1 && lines.every((l) => /^\|/.test(l))) {
    const cells = (l) => l.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
    const rows = lines.filter((l) => !/^\|[\s:|-]+\|$/.test(l)).map(cells);
    return '<table><thead><tr>' + rows[0].map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
      rows.slice(1).map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }
  if (lines.every((l) => /^>\s?/.test(l))) return '<blockquote>' + lines.map((l) => inline(l.replace(/^>\s?/, ''))).join('<br>') + '</blockquote>';
  return lines.map((l) => {
    const h = l.match(/^(#{1,2})\s+(.*)$/);
    if (h) return '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>';
    return l.startsWith('※') ? '<p class="note">' + inline(l) + '</p>' : '<p>' + inline(l) + '</p>';
  }).join('');
}

function renderMarkdown(md) {
  const html = [];
  const fence = /```(\w*)\n([\s\S]*?)```/g;
  let last = 0;
  let m;
  const pushText = (text) => text.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean).forEach((b) => html.push(renderBlock(b)));
  while ((m = fence.exec(md))) {
    pushText(md.slice(last, m.index));
    const lang = m[1] ? ' class="language-' + m[1] + '"' : '';
    html.push('<pre><code' + lang + '>' + escapeHtml(m[2].replace(/\n$/, '')) + '</code></pre>');
    last = fence.lastIndex;
  }
  pushText(md.slice(last));
  return html.join('');
}

// ---- スライドに切る ----
function buildSlide(text) {
  const el = document.createElement('section');
  el.className = 'slide';
  let body = text.trim();
  const marker = body.match(/^::(title|center|number|appendix)::\s*(\n|$)/);
  if (marker) {
    el.classList.add(marker[1]);
    body = body.slice(marker[0].length);
  }
  if (/^::right::\s*$/m.test(body)) {
    const [left, right] = body.split(/^::right::\s*$/m);
    const head = el.classList.contains('number') ? null : left.match(/^(#{1,2}\s+.*)\n/);
    const leftBody = head ? left.slice(head[0].length) : left;
    el.innerHTML = (head ? renderMarkdown(head[1]) : '') +
      '<div class="cols"><div>' + renderMarkdown(leftBody) + '</div><div>' + renderMarkdown(right) + '</div></div>';
  } else {
    el.innerHTML = renderMarkdown(body);
  }
  return el;
}

const source = document.getElementById('source').textContent;
const deck = document.getElementById('deck');
const slides = source.split(/^---\s*$/m).filter((s) => s.trim()).map(buildSlide);
slides.forEach((s) => deck.appendChild(s));

// ---- 付録：::appendix:: の枚を目次にし、後ろの枚へのリンクと戻り道を付ける ----
const appendixAt = slides.findIndex((s) => s.classList.contains('appendix'));
const mainCount = appendixAt < 0 ? slides.length : appendixAt;

function buildAppendix() {
  if (appendixAt < 0) return;
  const list = document.createElement('ol');
  list.className = 'appendix-list';
  slides.slice(appendixAt + 1).forEach((s, i) => {
    const title = s.querySelector('h1, h2');
    let ref = '';
    if (title) {
      const m = title.innerHTML.match(/\s*\{([\d,]+)\}\s*$/);
      if (m) { ref = ' <span class="toc-ref">→ 本編' + m[1].split(',').join('・') + '枚目</span>'; title.innerHTML = title.innerHTML.slice(0, m.index); }
    }
    const item = document.createElement('li');
    item.innerHTML = '<a href="#' + (appendixAt + i + 2) + '">' + (title ? title.innerHTML.replace(/^付録[：:]\s*/, '') : '付録 ' + (i + 1)) + '</a>' + ref;
    list.appendChild(item);
    s.classList.add('in-appendix');
    s.insertAdjacentHTML('beforeend', '<a class="back-link" href="#' + (appendixAt + 1) + '">← 付録の目次</a>');
  });
  slides[appendixAt].appendChild(list);
}
buildAppendix();
if (window.hljs) document.querySelectorAll('pre code').forEach((el) => window.hljs.highlightElement(el));
const firstHeading = slides[0] && slides[0].querySelector('h1');
if (firstHeading) document.title = firstHeading.textContent;

// ---- ページ送り ----
let current = 0;

function show(index) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  const inAppendix = appendixAt >= 0 && current >= appendixAt;
  const appendixLabel = current === appendixAt ? '付録' : '付録 ' + (current - appendixAt) + ' / ' + (slides.length - appendixAt - 1);
  document.getElementById('page').textContent = inAppendix
    ? appendixLabel
    : (current + 1) + ' / ' + mainCount;
  document.getElementById('progress').style.width = (inAppendix ? 100 : (current + 1) / mainCount * 100) + '%';
  history.replaceState(null, '', '#' + (current + 1));
}

function toggleOverview() {
  const on = document.body.classList.toggle('overview');
  if (!on) slides[current].scrollIntoView();
  else slides[current].scrollIntoView({ block: 'center' });
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

function toggleTheme() {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  root.dataset.theme = next;
  try { localStorage.setItem('slide-theme', next); } catch (e) { /* 保存できなくても表示は変わる */ }
}

const KEYS = {
  ArrowRight: () => show(current + 1), ArrowDown: () => show(current + 1), ' ': () => show(current + 1), PageDown: () => show(current + 1),
  ArrowLeft: () => show(current - 1), ArrowUp: () => show(current - 1), PageUp: () => show(current - 1),
  Home: () => show(0), End: () => show(slides.length - 1),
  o: toggleOverview, f: toggleFullscreen, t: toggleTheme,
};

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const action = KEYS[e.key];
  if (!action) return;
  e.preventDefault();
  action();
});

deck.addEventListener('click', (e) => {
  if (e.target.closest('a, pre, video')) return;
  const slide = e.target.closest('.slide');
  if (document.body.classList.contains('overview')) {
    if (slide) { show(slides.indexOf(slide)); toggleOverview(); }
    return;
  }
  show(current + (e.clientX < window.innerWidth / 3 ? -1 : 1));
});

try {
  const saved = localStorage.getItem('slide-theme');
  if (saved) document.documentElement.dataset.theme = saved;
} catch (e) { /* 既定の暗い方で表示 */ }

function showFromHash() { show(parseInt(location.hash.slice(1), 10) - 1 || 0); }
window.addEventListener('hashchange', showFromHash);
showFromHash();
</script>

</body></html>
